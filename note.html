<meta name="robots" content="noindex">
<meta property="og:type" content="website">

<meta property="og:description" content="Celebrate recovery milestones with local rewards, a private badge wall and support from people who care.">
<meta property="og:image" content="assets/og-image.png">

<body>
<main id="main" tabindex="-1">

<div class="wrap"><section class="card stack" id="note-box" style="max-width:560px;margin:0 auto">
  <h1>Leave a note for <span id="who">your friend</span></h1>
  <p class="muted">They'll see it first and decide whether to show it on their badge wall. Please keep their milestone private unless they share it.</p>
  <form id="note-form">
    <div class="field"><label for="author">Your name as it should appear</label><input id="author" type="text" maxlength="60" required></div>
    <div class="field"><label for="message">Your note</label><textarea id="message" maxlength="500" required placeholder="So proud of you…"></textarea></div>
    <button class="btn" type="submit">Send note</button>
  </form></section></div>
</main>
<script type="module" src="js/pages/note.js"></script>
</body>
</html>
