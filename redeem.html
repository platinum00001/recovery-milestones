<meta name="description" content="Celebrate recovery milestones with local rewards, a private badge wall and support from people who care.">

<meta property="og:site_name" content="Recovery Milestones">

<body>
<main id="main" tabindex="-1">

<div class="wrap"><section class="card stack" id="redeem-card" style="max-width:520px;margin:0 auto">
  <h1>Redeem a reward code</h1>
  <p class="muted">Type the 8-character code or scan the member's QR code with your phone camera.</p>
  <form id="redeem-form" class="stack">
    <label for="code">Code</label>
    <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="12" style="font-size:1.6rem;letter-spacing:.15em;text-transform:uppercase" required>
    <button class="btn block" type="submit">Mark as redeemed</button>
  </form>
  <div id="result" aria-live="polite"></div>
</section></div>
</main>
<script type="module" src="js/pages/redeem.js"></script>
</body>
</html>
